name: Apply cohort and assay foundation

on:
  push:
    branches: [agent/cohort-assay-foundation]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cohort-assay-foundation
      - run: python bootstrap_foundation.py
