name: Manual Python unit tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[review]"
      - run: python setup.py build_ext --inplace
      - run: python -m pytest -q
      - run: python scripts/check_evaluation.py
