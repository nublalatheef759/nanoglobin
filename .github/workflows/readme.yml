name: Executable README

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: executable-readme-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[review]"
      - uses: quarto-dev/quarto-actions/setup@v2
      - run: quarto render README.qmd
      - uses: actions/upload-artifact@v4
        with:
          name: executable-readme
          path: |
            README.md
            README_files
          if-no-files-found: error
      - name: Require generated README to be committed
        run: git diff --exit-code -- README.md README_files
