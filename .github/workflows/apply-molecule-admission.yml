name: Apply molecule-admission payload

on:
  push:
    branches:
      - agent/molecule-admission
    paths:
      - '.agent/molecule-admission.part*'
      - '.github/workflows/apply-molecule-admission.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/molecule-admission
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Verify and extract payload
        shell: bash
        run: |
          set -euo pipefail
          cat .agent/molecule-admission.part* | base64 -d > /tmp/molecule-admission.tar.gz
          echo "050933cd645cf9052f1fa89ff809a743af199942af46d38b9e1f2af491b949fe  /tmp/molecule-admission.tar.gz" | sha256sum -c -
          tar -xzf /tmp/molecule-admission.tar.gz
          rm -f .agent/molecule-admission.part*
          rmdir .agent 2>/dev/null || true
          rm -f .github/workflows/apply-molecule-admission.yml
      - name: Validate
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
          python -m pytest -q
          python -m compileall -q nanoglobin scripts tests
      - name: Commit generated implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add primer-aware amplicon molecule admission"
          git push origin HEAD:agent/molecule-admission
