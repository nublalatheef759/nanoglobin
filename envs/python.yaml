# Python analysis rules and reusable NanoGlobin kernels.
name: nanoglobin-python
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python=3.10
  - pandas=2.2
  - numpy=1.26
  - cython=3
  - c-compiler
  - setuptools>=68
  - wheel
  - requests=2.31
  - lxml=5.1
  - pysam=0.22
  - pyyaml=6
  - pytest=8
  - rapidfuzz=3.14
