[build-system]
requires = [
    "setuptools>=68",
    "wheel",
    "Cython>=3.0,<4",
    "numpy>=1.24,<3",
]
build-backend = "setuptools.build_meta"

[project]
name = "nanoglobin"
version = "0.1.0"
description = "Assay-aware globin genotyping and cohort normalisation kernels"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6",
    "numpy>=1.24,<3",
    "rapidfuzz>=3.9,<4",
]

[project.optional-dependencies]
review = [
    "jupyter>=1",
    "matplotlib>=3.8",
    "pandas>=2.0",
    "pytest>=8",
    "tabulate>=0.9",
]

[tool.setuptools]
packages = ["nanoglobin", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
