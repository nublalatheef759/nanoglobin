[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nanoglobin"
version = "0.1.0"
description = "Assay-aware globin genotyping and cohort normalisation kernels"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6", "rapidfuzz>=3.9,<4"]

[tool.setuptools]
packages = ["nanoglobin", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
