min_depth: 10
min_af: 0.15
mode: "amplicon"
samples: ["SRR37686269", "SRR37686273"]
ref_amplicon: "reference/hg38_globin.fa"
ref_wgs: "reference/hg38.fa"
csq_gff: "reference/ensembl_globin.gff3.gz"
clair3_path: "/rds/bear-apps/2022a/EL8-ice/software/Clair3/1.0.4-foss-2022a/bin/run_clair3.sh"
clair3_models: "models/r1041_e82_400bps_sup_v430"
sniffles_path: "/rds/homes/f/fnl759/.conda/envs/snakemake/bin/sniffles"
cutesv_path: "/rds/homes/f/fnl759/.conda/envs/snakemake/bin/cuteSV"
# Candidate-generation guard only. This is not the amplicon genotype model.
cutesv_min_support: 25
targets:
  HBA: "chr16:170000-178000"
  HBB: "chr11:5225000-5310000"
reference_region: "HBB"
coverage_bin_size: 200

# Explicit cohort-to-caller contracts. Set the relevant values to activate the
# corresponding Snakemake targets.
assay_profile: null
haplotype_catalogue: null
genotype_inference_profile: null
hba_family_sequences: null
hba_family_anchor: null
cohort_input: null
cohort_contract: null

# Genotype execution and optional control calibration. The Cython extension is
# built in the pinned Python environment before the genotype rule. `auto` falls
# back to the Python reference only when the compiled backend cannot represent the
# current candidate catalogue.
genotype_backend: "auto"
build_cython_extension: true
calibration_control_manifest: null
calibration_settings: "examples/calibration_settings.example.yml"
genotype_stability_profile: "examples/genotype_stability.example.yml"

# Primer-aware molecule admission. These parameters recognise read-end primers
# and score complete reads against products emitted by compile_assay. They are
# sequencing-evidence settings, distinct from template-binding max_mismatches in
# the assay profile.
molecule_admission:
  end_search_bp: 100
  primer_seed_length: 7
  min_primer_overlap: 10
  max_primer_mismatches: 4
  max_primer_error_rate: 0.25
  length_tolerance_fraction: 0.10
  max_sequence_edit_rate: 0.25
  sequence_assignment_margin: 0.02
  assumed_sequence_error_rate: 0.10
  max_reads: 0
