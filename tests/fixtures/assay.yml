assay_id: synthetic_globin_panel
version: "1"
platform: ont
primers:
  HBA_F:
    sequence: ACGTTGCAACGT
    max_mismatches: 0
  HBA_R:
    sequence: TTAACCGGTACC
    max_mismatches: 0
products:
